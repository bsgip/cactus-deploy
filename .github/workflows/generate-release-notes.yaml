name: Generate Changelog on Release

on:
  push:
    tags:
      - 'release-*'

jobs:
  generate-release-notes:
    name: Generate Changelog for Deploy Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to access previous tags

      - name: Determine current and previous tags
        id: tags
        run: |
          CURRENT_TAG=${GITHUB_REF_NAME}
          echo "Current tag: $CURRENT_TAG"

          # Branch-deploy tags (release-podman21) build images, but don't mint GitHub releases.
          if ! [[ "$CURRENT_TAG" =~ ^release-[0-9]+$ ]]; then
            echo "Not a numbered release - skipping release notes."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Highest numbered release below this one. Ordering is by release number, not creatordate:
          PREV_NUM=$(git tag -l 'release-*' | sed -n 's/^release-\([0-9]\+\)$/\1/p' | sort -n \
            | awk -v n="${CURRENT_TAG#release-}" '$1 < n' | tail -n1)
          if [ -z "$PREV_NUM" ]; then
            echo "ERROR: no numbered release tag older than $CURRENT_TAG"
            exit 1
          fi
          PREV_TAG="release-$PREV_NUM"
          echo "Previous tag: $PREV_TAG"
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Get versions files for current and previous tags
        id: versions
        if: steps.tags.outputs.skip != 'true'
        run: |
          mkdir versions
          git show ${{ steps.tags.outputs.previous_tag }}:docker/versions.lock > versions/previous
          git show ${{ steps.tags.outputs.current_tag }}:docker/versions.lock > versions/current
          echo "Previous and current versions.lock files extracted."

      - name: Generate Release Notes
        id: notes
        if: steps.tags.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/release_notes.py \
            --previous "${{ steps.tags.outputs.previous_tag }}" \
            --current "${{ steps.tags.outputs.current_tag }}" \
            --previous-lock versions/previous \
            --current-lock versions/current \
            --out-markdown versions/changes \
            --out-json versions/release-notes.json

      - name: Create GitHub Release
        if: steps.tags.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.current_tag }}
          name: ${{ steps.tags.outputs.current_tag }}
          body_path: versions/changes
          files: versions/release-notes.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
